server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # service worker a manifest sa nesmú cachovať, inak sa appka v mobiloch neaktualizuje
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # súbory s hashom v názve sa môžu cachovať natrvalo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
