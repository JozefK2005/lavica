server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # súbory nemajú v názve verziu, preto prehliadač pri každom otvorení overí,
    # či sa nezmenili (no-cache = použi cache, ale najprv sa opýtaj servera)
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # súbory, ktoré na webe nemajú čo robiť
    location ~ ^/(Dockerfile|nginx\.conf|README\.md|supabase/) {
        return 404;
    }
}
